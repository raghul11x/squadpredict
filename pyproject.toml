[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "squadpredict"
version = "0.1.0"
description = "eFootball match outcome predictor — OCR + Monte Carlo simulator + ML"
authors = [{name = "Raghul Raghavendra"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.30.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "joblib>=1.3.0",
    "easyocr>=1.7.0",
    "opencv-python>=4.8.0",
    "rapidfuzz>=3.5.0",
    "python-dotenv>=1.0.0",
    "huggingface-hub>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
